[package]
name = "postgres-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lineagedb-postgres"
path = "src/main.rs"

[dependencies]
database = { path = "../../database" }
pgwire = "0.40"
sqlparser = "0.62"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util"] }
async-trait = "0.1"
futures = "0.3"
env_logger = "0.10"
log = "0.4"
clap = { version = "4.0", features = ["derive"] }
uuid = "1"
